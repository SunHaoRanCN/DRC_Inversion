sample_rate: 44100
DRC: "compression"  # or "expansion"

duration: 5

n_class: 6

target_shape:
  f_dim: 64
  t_dim: 431

lr: 1e-4
lr_gamma: 0.98
batch_size: 8

early_stop: False
max_epoch: 200
min_epoch: 100
patience: 30

AST:
  MLPs: [1024, 512, 256, 64, 32]
  activation: PRelu
  norm: 'Layer'
  imagenet_pretrain: True
  audioset_pretrain: False

profiles: '5profiles.pkl'

model_save: "../experiments/pretrained_AST_MedleyDB_small.pt"

if_augmentation: False
Augmentation:
  snr_max: 65
  snr_min: 20
  step: 5
  epoch: 20